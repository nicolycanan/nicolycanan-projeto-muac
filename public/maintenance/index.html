<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0a0a0a">
  <title>Uma pausa no acervo — MUAC</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/maintenance/fonts/schoolbell.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face{font-family:Schoolbell;src:url('/maintenance/fonts/schoolbell.woff2') format('woff2');font-style:normal;font-weight:400;font-display:swap}
    @font-face{font-family:'Space Grotesk';src:url('/maintenance/fonts/space-grotesk.woff2') format('woff2');font-style:normal;font-weight:400;font-display:swap}
    @font-face{font-family:'Work Sans';src:url('/maintenance/fonts/work-sans.woff2') format('woff2');font-style:normal;font-weight:400;font-display:swap}
    *{box-sizing:border-box}html{color-scheme:dark;background:#0a0a0a}body{margin:0;min-height:100svh;background:#0a0a0a;color:#f2f0eb;font-family:'Work Sans',sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;padding:0 clamp(24px,6vw,88px)}
    ::selection{background:#ff5757;color:#fff}header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:34px 0;border-bottom:1px solid rgba(242,240,235,.14)}.logo{font-family:Schoolbell,cursive;font-size:46px;line-height:1}.status{display:flex;gap:10px;align-items:center;font:11px 'Space Grotesk',sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#b8b6ae}.status:before{content:'';height:6px;width:6px;background:#ff5757;border-radius:50%;flex-shrink:0}
    main{width:100%;max-width:840px;margin:auto;padding:clamp(64px,12vh,140px) 0}h1{font-family:Schoolbell,cursive;font-size:clamp(58px,9.5vw,112px);font-weight:400;letter-spacing:-.025em;line-height:1.05;margin:0 0 32px}.intro{color:#b8b6ae;max-width:460px;font-size:clamp(16px,2vw,19px);line-height:1.75;margin:0}.note{font-family:Schoolbell,cursive;font-size:27px;margin:32px 0 0;color:#f2f0eb;transform:rotate(-2deg);transform-origin:left center}
    footer{display:flex;justify-content:space-between;gap:24px;padding:24px 0 30px;border-top:1px solid rgba(242,240,235,.14);color:#74726b;font:11px 'Space Grotesk',sans-serif;letter-spacing:.04em;line-height:1.6}footer span:last-child{text-align:right}
    @media(max-width:540px){header{padding:26px 0}.logo{font-size:38px}.status{font-size:9px;letter-spacing:.09em}main{padding:76px 0}h1{margin-bottom:26px}.note{font-size:24px}footer{flex-direction:column;gap:8px}footer span:last-child{text-align:left}}
  </style>
</head>
<body>
  <header><span class="logo" aria-label="MUAC">Muac</span><span class="status">Em manutenção</span></header>
  <main>
    <h1>uma pausa<br>no acervo.</h1>
    <p class="intro">Estamos cuidando de alguns detalhes por aqui.<br>Em breve, as histórias e as imagens voltam a ocupar este espaço.</p>
    <p class="note">até a próxima descoberta.</p>
  </main>
  <footer><span>coisas que eu quero lembrar.</span><span>um acervo pessoal, em construção.</span></footer>
</body>
</html>
